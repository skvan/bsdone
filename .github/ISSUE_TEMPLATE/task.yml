name: "日常任务"
description: "不涉及产品功能的杂项工作：更新资料、检查配置、整理文档等"
labels: ["任务"]
body:
  - type: markdown
    attributes:
      value: |
        ### 一件要做的事
        非产品功能类的工作用这个模板登记，避免口头交代后遗忘。

        ---
        ### 交给 AI 做时，把下面这段一起发给它
        ```text
        请先阅读项目根目录的 AGENTS.md，并严格遵循其中的「单元测试」与「文档同步」规则：
        1. 为本次改动新增/更新单元测试（JUnit 5 + Mockito，纯单元测试，不启动 Spring、不连数据库），
           参考 bsball-backend/src/test/java/com/bsball/service/DataScopeServiceTest.java 的写法；
        2. 按「文档同步」清单更新对应文档；README / PROJECT_README 要同时更新 .zh-TW.md 繁体版，
           繁体版保留台湾用语；
        3. 完成后运行 mvn test 并贴出结果；如果失败，修到通过或说明原因；
        4. 不要修改与本次任务无关的文件。
        ```

  - type: input
    id: what
    attributes:
      label: "要做什么？"
      placeholder: "例如：把青训梯队的球员名单更新到系统里"
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: "做到什么程度算完成？（可选）"
      placeholder: "例如：名单里的 20 名球员都能在球队页面看到"
    validations:
      required: false

  - type: dropdown
    id: urgency
    attributes:
      label: "紧急程度"
      description: "拿不准就选「不确定」，负责人会帮忙评估"
      options:
        - "尽快（一周内）"
        - "本版本内完成"
        - "不急"
        - "不确定"
    validations:
      required: true
