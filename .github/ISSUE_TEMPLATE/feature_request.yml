name: "功能需求"
description: "提出一个现在还没有的新功能、新玩法或新页面"
labels: ["功能"]
body:
  - type: markdown
    attributes:
      value: |
        ### 说说你的想法
        把需求写清楚，评估后会安排排期。

        ---
        ### 交给 AI 做时，把下面这段一起发给它
        ```text
        请先阅读项目根目录的 AGENTS.md，并严格遵循其中的「单元测试」与「文档同步」规则：
        1. 为本次改动新增/更新单元测试（JUnit 5 + Mockito，纯单元测试，不启动 Spring、不连数据库），
           参考 bsball-backend/src/test/java/com/bsball/service/DataScopeServiceTest.java 的写法；
        2. 按「文档同步」清单更新对应文档；README / PROJECT_README 要同时更新 .zh-TW.md 繁体版，
           繁体版保留台湾用语；
        3. 完成后运行 mvn test 并贴出结果；如果失败，修到通过或说明原因；
        4. 不要修改与本次任务无关的文件。
        ```

  - type: input
    id: want
    attributes:
      label: "你想要什么功能？"
      placeholder: "例如：增加比赛数据导出 Excel 的功能"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: "为什么要它？"
      description: "什么场景下会用到它？它能帮你解决什么问题？"
      placeholder: "例如：每次比赛后需要把数据发给教练组，现在只能手动抄"
    validations:
      required: true

  - type: textarea
    id: expectation
    attributes:
      label: "你期望的效果（可选）"
      description: "可以描述理想中的样子，或贴上参考截图"
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: "重要程度"
      description: "拿不准就选「不确定」，负责人会帮忙评估"
      options:
        - "很需要，没有它工作受影响"
        - "需要，有它效率更高"
        - "有更好，没有也行"
        - "以后再说"
        - "不确定"
    validations:
      required: true
