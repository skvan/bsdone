# Manual production deployment - triggered ONLY via the Actions tab
# ("Run workflow" button) after entering the release version number.
#
# What it does:
#   1. builds bsball-server jar from the CURRENT commit (tests included);
#      the release version is injected into the jar (-Dapp.release.version)
#      and verified against the jar's application.yml placeholder
#   2. applies the release version to the legacy frontend artifacts
#      (apply-release-version.mjs), builds the rebuilt frontend
#      (bs-ball-next) and packs the dual-track webapps package, then
#      uploads it, together with the jar + scripts/deploy-prod.sh, to the
#      server staging dir
#   3. runs the deploy script on the server: safety gate -> backup ->
#      atomic jar swap -> restart java-server -> health check ->
#      frontend (STEP 4, from the staged package) -> automatic rollback on failure
#
# NOTE: the frontend package is ALWAYS staged, so a production deploy keeps the
#       served frontend in sync with the deployed ref (fixes the case where the
#       footer/version or LiveGame assets stayed on an older build because no
#       frontend package had been uploaded manually).
#
# Required repository secrets: PROD_HOST, PROD_USER, PROD_SSH_KEY
name: Deploy Production (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '本次发布版本号（如 2.0.0，不带 v 前缀）。留版本记录并作为防误触门槛；注入 jar 并刷写前端产物版本（apply-release-version）'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy (jar + frontend) to production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend jar (tests included)
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd bsball-backend
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::version input is required for production deploys - aborting"
            exit 1
          fi
          if [[ "$RELEASE_VERSION" =~ [[:cntrl:]] || "$RELEASE_VERSION" == *'"'* ]]; then
            echo "::error::version contains control characters or double quotes - aborting"
            exit 1
          fi
          if [[ "$RELEASE_VERSION" == v* ]]; then
            echo "::warning::version starts with 'v'; prefer bare version like 1.1.2"
          fi
          echo "release version override: $RELEASE_VERSION"
          mvn clean package --batch-mode -Dapp.release.version="$RELEASE_VERSION"
          echo "== app.release-version written into jar (must equal input) =="
          unzip -p target/bsball-server-1.0.0.jar BOOT-INF/classes/application.yml | grep -F "release-version: \"$RELEASE_VERSION\"" || { echo "::error::release-version mismatch in jar"; exit 1; }
          echo "== jar md5 =="
          md5sum target/bsball-server-1.0.0.jar

      - name: Upload jar artifact (rollback evidence)
        uses: actions/upload-artifact@v4
        with:
          name: bsball-server-jar
          path: bsball-backend/target/bsball-server-1.0.0.jar
          retention-days: 30

      - name: Prepare SSH and staging dir
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$PROD_USER@$PROD_HOST" \
            'mkdir -p /root/deploy-prod/staging && echo STAGING_READY'

      - name: Upload jar (chunked, parallel, retries) + deploy script
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -e
          STAGE=/root/deploy-prod/staging
          JAR=bsball-backend/target/bsball-server-1.0.0.jar
          KEY=$HOME/.ssh/id_deploy
          TARGET="$PROD_USER@$PROD_HOST"
          SCP_OPTS="-o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=15"

          echo "== small file first: deploy script =="
          scp -i "$KEY" $SCP_OPTS scripts/deploy-prod.sh "$TARGET:$STAGE/deploy-prod.sh.new"

          echo "== big file: chunked parallel upload (6MB x 4 connections, per-chunk retries) =="
          echo "(single 84MB scp to a cross-border host stalled on 2026-09-21;"
          echo " short parallel chunks with retries are stable)"
          LOCAL_MD5=$(md5sum "$JAR" | cut -d' ' -f1)
          echo "local jar md5: $LOCAL_MD5"
          split -b 6m -d -a 2 "$JAR" /tmp/chunk_
          CHUNKS=$(ls /tmp/chunk_* | wc -l)
          echo "split into $CHUNKS chunks"

          upload_chunk() {
            local f="$1" t
            for t in 1 2 3 4 5; do
              if scp -i "$KEY" $SCP_OPTS "$f" "$TARGET:$STAGE/parts/"; then
                return 0
              fi
              echo "  retry $t for $(basename "$f")"
              sleep 3
            done
            echo "  FATAL: $(basename "$f") failed after 5 attempts"
            return 1
          }
          export -f upload_chunk
          export KEY TARGET STAGE SCP_OPTS

          ssh -i "$KEY" $SCP_OPTS "$TARGET" "rm -rf $STAGE/parts && mkdir -p $STAGE/parts"
          ls /tmp/chunk_* | xargs -P 4 -I {} bash -c 'upload_chunk "$1"' _ {}

          echo "== assembling remotely + verifying md5 =="
          REMOTE_PARTS=$(ssh -i "$KEY" $SCP_OPTS "$TARGET" "ls $STAGE/parts | wc -l")
          echo "remote parts: $REMOTE_PARTS (expect $CHUNKS)"
          if [ "$REMOTE_PARTS" != "$CHUNKS" ]; then
            echo "::error::chunk count mismatch after upload"
            exit 1
          fi
          REMOTE_MD5=$(ssh -i "$KEY" $SCP_OPTS "$TARGET" "cd $STAGE/parts && cat chunk_* > $STAGE/bsball-server-1.0.0.jar.new && cd $STAGE && rm -rf parts && md5sum bsball-server-1.0.0.jar.new | cut -d' ' -f1")
          echo "remote jar md5: $REMOTE_MD5"
          if [ "$REMOTE_MD5" != "$LOCAL_MD5" ]; then
            echo "::error::jar md5 mismatch after chunked upload (local=$LOCAL_MD5 remote=$REMOTE_MD5)"
            exit 1
          fi
          echo "chunked upload verified OK"

      - name: Apply release version to frontend bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node bsball_project/scripts/apply-release-version.mjs --version "$RELEASE_VERSION"

      - name: Set up Node.js (rebuilt frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bsball-frontend/package-lock.json

      - name: Build rebuilt frontend (bs-ball-next, dual-track) and pack webapps tarball
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -e
          export VITE_APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          cd bsball-frontend
          npm ci --no-audit --no-fund
          export VITE_APP_VERSION="$RELEASE_VERSION"
          npx vite build --base=/bs-ball-next/
          node scripts/package-webapps.mjs --next --version="$RELEASE_VERSION" --build-time="$VITE_APP_BUILD_TIME"
          cp dist/webapps-dev.tar.gz /tmp/webapps-prod.tar.gz
          echo "== tarball structure check (dual-track) =="
          for entry in webapps/bs-ball/index.html webapps/bs-ball/version.json webapps/bs-ball-next/index.html webapps/bs-ball-next/version.json webapps/portal.html; do
            tar -tzf /tmp/webapps-prod.tar.gz | grep -qx "$entry" || { echo "::error::missing $entry in tarball"; exit 1; }
          done
          echo "tarball structure OK"
          echo "== tarball md5 =="
          ls -l /tmp/webapps-prod.tar.gz
          md5sum /tmp/webapps-prod.tar.gz

      - name: Upload frontend package to staging (retries)
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -e
          STAGE=/root/deploy-prod/staging
          PKG=/tmp/webapps-prod.tar.gz
          KEY=$HOME/.ssh/id_deploy
          TARGET="$PROD_USER@$PROD_HOST"
          SCP_OPTS="-o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=15"
          LOCAL_MD5=$(md5sum "$PKG" | cut -d' ' -f1)
          echo "local frontend package md5: $LOCAL_MD5"
          ok=0
          for t in 1 2 3 4 5; do
            if scp -i "$KEY" $SCP_OPTS "$PKG" "$TARGET:$STAGE/webapps-prod.tar.gz.new"; then
              echo "frontend scp ok (attempt $t)"
              ok=1
              break
            fi
            echo "  retry $t for frontend package ..."
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::frontend package upload failed after 5 attempts"
            exit 1
          fi
          REMOTE_MD5=$(ssh -i "$KEY" $SCP_OPTS "$TARGET" "md5sum $STAGE/webapps-prod.tar.gz.new | cut -d' ' -f1")
          echo "remote frontend package md5: $REMOTE_MD5"
          if [ "$REMOTE_MD5" != "$LOCAL_MD5" ]; then
            echo "::error::frontend package md5 mismatch (local=$LOCAL_MD5 remote=$REMOTE_MD5)"
            exit 1
          fi
          echo "frontend package staged OK"

      - name: Deploy on server (safety gate -> swap -> restart -> health -> rollback)
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$PROD_USER@$PROD_HOST" \
            'bash -n /root/deploy-prod/staging/deploy-prod.sh.new && bash /root/deploy-prod/staging/deploy-prod.sh.new'
