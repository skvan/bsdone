name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'v*/dev', 'feature/**']
  pull_request:
    branches: [main, 'v*/dev']

jobs:
  backend-compile:
    name: Backend Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Backend
        run: |
          cd bsball-backend
          mvn compile -q --batch-mode

      - name: Run Backend Tests
        run: |
          cd bsball-backend
          mvn test --batch-mode

  frontend-syntax:
    name: Frontend Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed webapps JS files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}..HEAD"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$RANGE" -- 'bsball_project/webapps' | grep -E '\.js$' || true)
          echo "changed js files:"
          echo "$FILES"
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: node --check changed JS (ESM, classic-script fallback)
        if: steps.changed.outputs.files != ''
        run: |
          FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp "$f" /tmp/check.mjs
            if node --check /tmp/check.mjs 2>/tmp/check-esm.err; then
              echo "OK (ESM)    $f"
            else
              cp "$f" /tmp/check.cjs
              if node --check /tmp/check.cjs 2>/tmp/check-cjs.err; then
                echo "::warning file=$f::parses as classic script only (not ESM)"
              else
                echo "::error file=$f::JS syntax check FAILED"
                sed -n '1,3p' /tmp/check-esm.err || true
                FAIL=1
              fi
            fi
          done <<< "${{ steps.changed.outputs.files }}"
          exit "$FAIL"

  live-game-e2e:
    name: LiveGame browser E2E
    if: ${{ github.event_name == 'workflow_dispatch' || vars.LIVEGAME_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bsball-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: bsball-frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: bsball-frontend
        run: npx playwright install --with-deps chromium
      - name: Run LiveGame E2E
        working-directory: bsball-frontend
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_TENANT: ${{ secrets.E2E_TENANT }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EVENT_ID: ${{ secrets.E2E_EVENT_ID }}
          E2E_GAME_ID: ${{ secrets.E2E_GAME_ID }}
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-game-playwright-report
          path: bsball-frontend/test-results

      - name: Verify .gz twins decode to their JS
        if: steps.changed.outputs.files != ''
        run: |
          FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f.gz" ]; then
              if zcat "$f.gz" | cmp -s - "$f"; then
                echo "OK  $f.gz"
              else
                echo "::error file=$f.gz::stale gz twin (must decode to its .js) - regenerate it"
                FAIL=1
              fi
            fi
          done <<< "${{ steps.changed.outputs.files }}"
          exit "$FAIL"
