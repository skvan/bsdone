name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'v*/dev', 'feature/**']
  pull_request:
    branches: [main, 'v*/dev']

jobs:
  backend-compile:
    name: Backend Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Backend
        run: |
          cd bsball-backend
          mvn compile -q --batch-mode

      - name: Run Backend Tests
        run: |
          cd bsball-backend
          mvn test --batch-mode

  live-game-local-e2e:
    name: Local LiveGame browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bsball-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: bsball-frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: bsball-frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend regression tests
        working-directory: bsball-frontend
        run: node --test tests/*.test.mjs
      - name: Build and verify single-track package
        working-directory: bsball-frontend
        run: npm run package
      - name: Run local LiveGame E2E without private credentials
        working-directory: bsball-frontend
        run: npm run test:e2e:local
      - name: Upload local Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-game-local-playwright-report
          path: bsball-frontend/test-results

  live-game-e2e:
    name: LiveGame browser E2E
    if: ${{ github.event_name == 'workflow_dispatch' || vars.LIVEGAME_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bsball-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: bsball-frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: bsball-frontend
        run: npx playwright install --with-deps chromium
      - name: Run LiveGame E2E
        working-directory: bsball-frontend
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_TENANT: ${{ secrets.E2E_TENANT }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EVENT_ID: ${{ secrets.E2E_EVENT_ID }}
          E2E_GAME_ID: ${{ secrets.E2E_GAME_ID }}
        run: npx playwright test e2e/live-game-save.spec.js
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-game-playwright-report
          path: bsball-frontend/test-results
