<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 旧版入口封锁（H60）：/bs-ball/* 全部经此页映射至新版对应路径（深链前缀互换，与 H27 映射规则同构）。
       JS 在 head 同步执行 location.replace（replace 不产生历史残留）；meta refresh 仅作禁用脚本时的兜底。
       本页非版本注入目标（apply-release-version 不覆盖此文件），故不含版本锚点。 -->
  <script>
    (function () {
      var p = window.location.pathname;
      var t = '/bs-ball-next/';
      if (p === '/bs-ball' || p === '/bs-ball/' || p === '/bs-ball/index.html') t = '/bs-ball-next/bs-ball/';
      else if (p.indexOf('/bs-ball/') === 0) t = '/bs-ball-next' + p.slice('/bs-ball'.length);
      location.replace(t + window.location.search + window.location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/bs-ball-next/" />
  <title>BS Ball</title>
  <link rel="icon" type="image/png" href="/bs-ball/bs-ball-logo.png" />
  <style>
    /* 直通页（H60）：旧系统入口封锁 —— 不加载旧版任何资源，直达新版对应页。 */
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      background: #0a1628;
      color: rgba(255, 255, 255, .78);
      -webkit-font-smoothing: antialiased;
    }
    .mark { font-size: 30px; font-weight: 700; letter-spacing: 6px; color: #fff; }
    .tip { margin: 0; font-size: 14px; letter-spacing: 1px; }
    a { color: #c9a227; }
  </style>
</head>
<body>
  <div class="mark">BS Ball</div>
  <p class="tip">正在进入新版…</p>
  <p class="tip">如未自动跳转，请<a href="/bs-ball-next/">点击此处</a></p>
</body>
</html>
