<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人驾驶舱 · 整页高保真</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 16px 48px; background: #f2efe9; color: #071a33; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 24px; color: #5b6472; font-size: 13px; line-height: 1.6; }
    section { margin: 0 auto 32px; max-width: 1200px; }
    h2 { margin: 0 0 10px; font-size: 15px; color: #7a5a1f; }
    img { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 16px 40px rgba(7,26,51,.14); background: #fff; }
    .mobile { max-width: 430px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>个人驾驶舱 · 整页高保真</h1>
  <p>球星卡在顶部；当前赛事/下一场在「接下来的比赛」模块。含字号、口径说明和移动端节奏优化。</p>

  <section>
    <h2>桌面 · 浅色</h2>
    <img src="https://raw.githubusercontent.com/skvan/bsdone/design-preview-temp/design-preview/clubhouse-detail-full-light-desktop.jpg" alt="桌面浅色整页">
  </section>
  <section>
    <h2>桌面 · 深色</h2>
    <img src="https://raw.githubusercontent.com/skvan/bsdone/design-preview-temp/design-preview/clubhouse-detail-full-dark-desktop.jpg" alt="桌面深色整页">
  </section>
  <section class="grid">
    <div class="mobile">
      <h2>手机 · 浅色</h2>
      <img src="https://raw.githubusercontent.com/skvan/bsdone/design-preview-temp/design-preview/clubhouse-detail-full-light-mobile.jpg" alt="手机浅色整页">
    </div>
    <div class="mobile">
      <h2>手机 · 深色</h2>
      <img src="https://raw.githubusercontent.com/skvan/bsdone/design-preview-temp/design-preview/clubhouse-detail-full-dark-mobile.jpg" alt="手机深色整页">
    </div>
  </section>
</body>
</html>
