# =============================================================================
# 生产环境（spring.profiles.active=prod）
# =============================================================================
# PostgreSQL + Druid + JPA + Flyway。所有配置项均有默认值，
# 可通过环境变量或启动参数可选覆盖。
#
# 环境变量覆盖（均为可选）：
#   - SERVER_ADDRESS: 服务监听地址（默认 127.0.0.1）
#   - DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME
#   - JWT_SECRET: JWT 签名密钥（默认已有值）
#   - DRUID_LOGIN_PASSWORD: Druid 监控页密码
#   - APP_SMS_ENABLED / ALIYUN_SMS_ACCESS_KEY_ID 等：短信配置（默认已有值）
#   - APP_AMAP_WEB_KEY 等：地图 API Key（默认已有值）
# =============================================================================

logging:
  level:
    root: WARN
    com.bsball: INFO
server:
  # 生产默认仅本机监听，通过 Nginx 反向代理对外暴露
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  #  #################### SQLite 数据库 Start ####################
#  datasource:
#    url: jdbc:sqlite:${DB_PATH:${app.workspace:.}/data/bsball.db}
#    driver-class-name: org.sqlite.JDBC
#    hikari:
#      maximum-pool-size: 3
#      minimum-idle: 1
#      auto-commit: false
#  jpa:
#    # 使用自定义方言，建表/改表时不生成 COMMENT ON（SQLite 不支持）
#    database-platform: com.bsball.config.SQLiteNoCommentDialect
#    hibernate:
#      ddl-auto: update
#    show-sql: false
  #  #################### SQLite 数据库 End ####################

  # #################### PostgreSQL ####################
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bsball}?reWriteBatchedInserts=true
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:DrYCLl6dcp7jTiX8VobU}
    driver-class-name: org.postgresql.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        # 云服务器需外网访问时：allow 留空或设环境变量 DRUID_STAT_ALLOW= 空；限制 IP 可填 1.2.3.4,5.6.7.8
        allow: ${DRUID_STAT_ALLOW:}
        login-username: ${DRUID_LOGIN_USER:admin}
        login-password: ${DRUID_LOGIN_PASSWORD:admin_druid}
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.css,*.gif,*.png,*.jpg,*.ico,/druid/*"
      filter:
        stat:
          enabled: true
        wall:
          enabled: true
          throw-exception: false
          config:
            db-type: postgresql
            none-base-statement-allow: true
            strict-syntax-check: false
            alter-table-allow: true
            create-table-allow: true
  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: public
  # enabled=false：由 FlywayAfterHibernateConfiguration 在 Hibernate 建表后再 migrate（空库兼容）
  flyway:
    enabled: false
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bsball}?reWriteBatchedInserts=true
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:DrYCLl6dcp7jTiX8VobU}
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: true
    baseline-version: 0
    # 允许执行「版本号小于当前库已应用最大版本」的未执行脚本（例如后发合并里带了更早时间戳的迁移，如 V20260410180000）
    out-of-order: true
  #  #################### PostgreSQL 数据库 End ####################

  #  #################### MySQL 数据库 Start ####################
#  datasource:
#    type: com.alibaba.druid.pool.DruidDataSource
#    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bsball}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
#    username: ${DB_USER:root}
#    password: ${DB_PASSWORD:123456}
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    druid:
#      default-auto-commit: false
#      initial-size: 2
#      min-idle: 2
#      max-active: 20
#      max-wait: 60000
#      test-while-idle: true
#      validation-query: SELECT 1
#      stat-view-servlet:
#        enabled: true
#        url-pattern: /druid/*
#        allow: ${DRUID_STAT_ALLOW:127.0.0.1}
#        login-username: ${DRUID_LOGIN_USER:admin}
#        login-password: ${DRUID_LOGIN_PASSWORD:admin_druid}
#      web-stat-filter:
#        enabled: true
#        url-pattern: /*
#        exclusions: "*.js,*.css,*.gif,*.png,*.jpg,*.ico,/druid/*"
#      filter:
