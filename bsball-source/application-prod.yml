# ------------------------------------------------------------------------------
# JWT（与 application.yml 的 app.jwt 合并；prod 覆盖密钥，禁止沿用开发默认值）
# ------------------------------------------------------------------------------
app:
  init:
    import-test-data: ${APP_IMPORT_TEST_DATA:${APP_INIT_IMPORT_TEST_DATA:true}}
    seed-tenant-id: ${APP_INIT_SEED_TENANT_ID:2}
  upload:
    # 生产环境上传目录（可通过 APP_UPLOAD_DIR 覆盖）
    dir: ${APP_UPLOAD_DIR:uploads}
  flyway:
    run-after-hibernate: true
  jwt:
    # HS256 密钥 UTF-8 长度须 ≥ 32（生产环境必须通过 JWT_SECRET 环境变量覆盖）
    # 生成示例：openssl rand -hex 32
    secret: ${JWT_SECRET:yehQy0pZuhaDdRtP0N5R8XFBhm8hWCqJ}
  open-platform:
    lbs:
      providers:
        amap:
          # 可通过 APP_AMAP_WEB_KEY 环境变量覆盖
          key: ${APP_AMAP_WEB_KEY:9afe0ba888f54b558e997ba6f1448550}
        baidu:
          # 可通过 APP_BAIDU_MAP_AK 环境变量覆盖
          key: ${APP_BAIDU_MAP_AK:EDpfAn3kTcZptsHfX9X1zoU3dKT2Zsu8}
        tencent:
          # 可通过 APP_TENCENT_MAP_KEY 环境变量覆盖
          key: ${APP_TENCENT_MAP_KEY:4EABZ-MQ3CX-FUV4F-ZH2UH-ZR665-FZFGT}
        interface-box:
          enabled: ${APP_INTERFACE_BOX_ENABLED:true}
          key: ${APP_INTERFACE_BOX_KEY:82df5f28491f6750e1184b12e8366526}
          id: ${APP_INTERFACE_BOX_ID:10015630}
  # 短信服务（阿里云短信）
  # 所有配置项均有默认值，可通过环境变量可选覆盖
  sms:
    enabled: ${APP_SMS_ENABLED:true}
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:LTAI5t8hgmnsEu6k4RguEgs6}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:FnXY9Nwc2unJYKrMS3w6NF2pHZKKxG}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:广州康胜体育管理}
    template-code-register: ${ALIYUN_SMS_TEMPLATE_REGISTER:SMS_508140178}
    template-code-login: ${ALIYUN_SMS_TEMPLATE_LOGIN:SMS_508265171}
    template-code-reset-password: ${ALIYUN_SMS_TEMPLATE_RESET_PASSWORD:}
  # 气象抓取：按 cron 拉取第三方 JSONP 并转换为 GeoJSON 文件
  weather-fetch:
    cron: ${APP_WEATHER_FETCH_CRON:0 */30 * * * *}
    save-dir: ${APP_WEATHER_FETCH_SAVE_DIR:/usr/local/webapps/resources/weather}
