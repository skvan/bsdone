# ------------------------------------------------------------------------------
# dev：控制台 SQL 尽量单行（Hibernate 见 application.yml 中 hibernate.format_sql）
# ------------------------------------------------------------------------------
app:
  init:
    import-test-data: ${APP_IMPORT_TEST_DATA:${APP_INIT_IMPORT_TEST_DATA:true}}
    seed-tenant-id: ${APP_INIT_SEED_TENANT_ID:1}
  upload:
    # 开发环境默认使用独立目录，便于与生产区分
    dir: ${APP_UPLOAD_DIR:uploads-local}
  # true：Flyway 在 Hibernate ddl 之后执行（空库先有实体表再跑 ALTER/COMMENT 类迁移）；false：不执行延后迁移
  flyway:
    run-after-hibernate: true
  open-platform:
    lbs:
      providers:
        amap:
          # 开发环境地图 API Key（可通过 APP_AMAP_WEB_KEY 环境变量覆盖）
          key: ${APP_AMAP_WEB_KEY:9afe0ba888f54b558e997ba6f1448550}
        baidu:
          # 开发环境地图 API Key（可通过 APP_BAIDU_MAP_AK 环境变量覆盖）
          key: ${APP_BAIDU_MAP_AK:EDpfAn3kTcZptsHfX9X1zoU3dKT2Zsu8}
        tencent:
          # 开发环境地图 API Key（可通过 APP_TENCENT_MAP_KEY 环境变量覆盖）
          key: ${APP_TENCENT_MAP_KEY:4EABZ-MQ3CX-FUV4F-ZH2UH-ZR665-FZFGT}
        interface-box:
          enabled: ${APP_INTERFACE_BOX_ENABLED:true}
          key: ${APP_INTERFACE_BOX_KEY:82df5f28491f6750e1184b12e8366526}
          id: ${APP_INTERFACE_BOX_ID:10015630}
  sql:
    format: false
  # 阿里云短信（开发环境）
  # 注意：sign-name 必须填入阿里云已审核通过的「短信签名」，否则发送会被阿里云拒绝（mock 仅打印验证码）。
  sms:
    # 开发环境默认不真实发送（仅在日志打印验证码，不消耗短信额度）。
    # 需要联调真发时，启动加环境变量 APP_SMS_ENABLED=true 即可临时开启。
    enabled: ${APP_SMS_ENABLED:false}
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:LTAI5t8hgmnsEu6k4RguEgs6}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:FnXY9Nwc2unJYKrMS3w6NF2pHZKKxG}
    # 短信签名（必填，需阿里云审核通过）
    sign-name: ${ALIYUN_SMS_SIGN_NAME:广州康胜体育管理}
    # 注册验证码模板 Code（${code}/${time}）
    template-code-register: ${ALIYUN_SMS_TEMPLATE_REGISTER:SMS_508140178}
    # 登录验证码模板 Code（${code}/${time}）
    template-code-login: ${ALIYUN_SMS_TEMPLATE_LOGIN:SMS_508265171}
    # 重置密码验证码模板 Code（${code}/${time}；未配置时回退到注册模板）
    template-code-reset-password: ${ALIYUN_SMS_TEMPLATE_RESET_PASSWORD:}
  auth:
    captcha:
      # 与 application.yml 默认一致（false）；需要落盘时设 true 或环境变量 APP_AUTH_*=true。
      # Dev profile 不再默认 true，避免覆盖主配置里写的 false（Spring 后加载的 profile 会覆盖同名键）。
      debug-save-on-fail: ${APP_AUTH_CAPTCHA_DEBUG_SAVE_ON_FAIL:false}
      debug-save-on-success: ${APP_AUTH_CAPTCHA_DEBUG_SAVE_ON_SUCCESS:false}
      debug-save-dir: ${APP_AUTH_CAPTCHA_DEBUG_SAVE_DIR:logs/captcha-debug}